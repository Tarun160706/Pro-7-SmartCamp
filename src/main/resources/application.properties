# ==============================================================
# APPLICATION NAME
# ==============================================================
# This gives a name to your Spring Boot application.
# It's used in logs, actuator endpoints, and service discovery.
spring.application.name=SmartCampusServiceManagement

# ==============================================================
# POSTGRESQL DATABASE CONFIGURATION
# ==============================================================
# These properties tell Spring Boot how to connect to PostgreSQL.

# DATABASE URL
# Format: jdbc:postgresql://<host>:<port>/<database_name>
# - jdbc:postgresql = Protocol (Java Database Connectivity for PostgreSQL)
# - localhost = The server where PostgreSQL is running (your machine)
# - 5432 = PostgreSQL's default port number
# - smart_campus_db = The database we created for this project
#
# Interview Q: "What is JDBC?"
# A: "JDBC (Java Database Connectivity) is a Java API that defines
#     how a client may access a database. It provides methods for
#     querying and updating data. Spring Data JPA uses JDBC internally
#     through Hibernate to communicate with the database."
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_campus_db

# DATABASE USERNAME
# The PostgreSQL user that the application will use to connect.
spring.datasource.username=postgres

# DATABASE PASSWORD
# The password for the PostgreSQL user.
# NOTE: In a real production application, you should NEVER hardcode
# passwords. You would use environment variables like:
#   spring.datasource.password={DB_PASSWORD}
# For this learning project, we're keeping it simple.
spring.datasource.password=Tarun@123

# JDBC DRIVER CLASS
# This tells Spring which JDBC driver to use.
# Spring Boot can auto-detect this from the URL, but being explicit
# makes it clearer and is a good practice.
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# JPA / HIBERNATE CONFIGURATION
# ==============================================================

# HIBERNATE DDL AUTO
# This controls how Hibernate manages the database schema:
#
# - "create"       = Drop and recreate all tables every time the app starts (DATA LOSS!)
# - "create-drop"  = Same as create, but also drops tables when app stops
# - "update"       = Update the schema to match entities WITHOUT dropping data
# - "validate"     = Only validate that entities match the database schema (no changes)
# - "none"         = Do nothing with the schema
#
# We use "update" during development so Hibernate automatically
# creates/modifies tables based on our @Entity classes.
# In production, you would use "validate" or "none" with migration tools like Flyway.
#
# Interview Q: "What is Hibernate DDL auto?"
# A: "It controls how Hibernate manages the database schema on startup.
#     In development, I use 'update' which automatically creates or
#     alters tables to match my entity classes. In production, I would
#     use 'validate' to only check that the schema matches, and use
#     a migration tool like Flyway for schema changes."
spring.jpa.hibernate.ddl-auto=update

# SHOW SQL
# When true, Hibernate prints every SQL query it executes to the console.
# This is extremely useful during development for debugging.
# Set to false in production to reduce log noise.
#
# Interview Q: "How do you debug JPA queries?"
# A: "I enable spring.jpa.show-sql=true and spring.jpa.properties.hibernate.format_sql=true
#     to see the actual SQL queries Hibernate generates. This helps me
#     verify that my JPA methods are producing efficient queries."
spring.jpa.show-sql=true

# FORMAT SQL
# Makes the printed SQL queries nicely formatted (indented) instead
# of being on a single long line. Makes debugging much easier.
spring.jpa.properties.hibernate.format_sql=true

# HIBERNATE DIALECT
# The dialect tells Hibernate which SQL flavor to generate.
# PostgreSQL has its own SQL syntax differences from MySQL, Oracle, etc.
# Hibernate uses this to generate PostgreSQL-compatible SQL.
#
# Interview Q: "What is Hibernate Dialect?"
# A: "Hibernate Dialect is a class that tells Hibernate how to generate
#     SQL for a specific database. Each database (PostgreSQL, MySQL, Oracle)
#     has slightly different SQL syntax. The dialect ensures Hibernate
#     generates the correct SQL for our PostgreSQL database."
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# NOTE: Hibernate auto-detects the dialect from the JDBC URL, so we comment this out.
# Keeping it here for interview reference - if asked, you know what dialect means.

# ==============================================================
# SERVER CONFIGURATION
# ==============================================================

# SERVER PORT
# The port on which the embedded Tomcat server will listen.
# Default is 8080. You can change this if 8080 is already in use.
server.port=8080

# OPEN-IN-VIEW
# Disabling this avoids lazy-loading queries during view rendering.
# This is a best practice for REST APIs (we don't have views).
spring.jpa.open-in-view=false

